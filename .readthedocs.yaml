version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  commands:
    - python -m pip install "sphinx>=9.1.0,<10" "furo>=2025.12.19,<2026" "sphinx-copybutton>=0.5.2,<1 discord.py>=2.7.1,<3"
    - python3 -m sphinx -aEnTW --builder html --keep-going docs/ $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true