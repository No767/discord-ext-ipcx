name: Release
on:
  push:
    branches:
      - main
jobs:
  Release:
    runs-on: ubuntu-24.04

    if: contains(github.event.head_commit.message, '#major') || contains(github.event.head_commit.message, '#minor') || contains(github.event.head_commit.message, '#patch')
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        fetch-depth: '0'

    - name: Generate release notes
      uses: no767/get-releasenote@3eedfc5c134cf232520bb18ccc856838dbdc0b3f
      with:
        name: discord-ext-ipcx
        changes_file: changelog.md
        output_file: output.md
        version_file: discord/ext/ipcx/__init__.py

    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
      id: tag_version
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        WITH_V: true
        RELEASE_BRANCHES: main
        
    - name: Release New Version
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        bodyFile: "output.md"
        token: ${{ secrets.RELEASE_TOKEN }}
        tag: ${{ steps.tag_version.outputs.new_tag }}
        name: ${{ steps.tag_version.outputs.new_tag }}