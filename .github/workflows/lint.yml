name: Lint
on:
  push:
    branches:
      - main
      
  pull_request:
    branches:
      - main

jobs:
  Check:
    runs-on: ubuntu-24.04

    name: Check (${{ matrix.version }})

    strategy:
      fail-fast: false
      matrix:
        version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Repository  
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}

      - name: Install packages
        run: |
          pip install -r requirements.txt pyright[nodejs]>=1.1.386,<2 ruff>=0.7.1,<1

      - name: Check typing
        run: |
          pyright discord/ext/ipcx

      - name: Check codebase
        run: |
          ruff check discord/ext/ipcx --exit-non-zero-on-fix

      - name: Check for formatting
        run: |
          ruff format discord/ext/ipcx --check