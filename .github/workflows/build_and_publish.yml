name: Build and Publish
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  Build:
    runs-on: ubuntu-26.04

    env:
      UV_NO_CACHE: true

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "latest"

      - name: Verify lockfile
        run: uv lock --check

      - name: Build package
        run: uv build --require-hashes

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  Publish:
    runs-on: ubuntu-26.04
    needs: Build

    environment:
      name: pypi
      url: https://pypi.org/p/discord-ext-ipcx
 
    permissions:
      id-token: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
          
      - name: Publish Packages to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          print-hash: true
          verbose: true
