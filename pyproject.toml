[project]
name = "discord-ext-ipcx"
description = "Maintained and updated version of discord-ext-ipc for discord.py v2"
version = "0.4.0"
authors = [
    { name="No767", email="73260931+No767@users.noreply.github.com"}
]
maintainers = [
    { name="No767", email="73260931+No767@users.noreply.github.com"}
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "discord.py", 
    "asyncio", 
    "networking",
    "discord-ext-ipcx", 
    "discord-ext-ipc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed"
]

requires-python = ">=3.10,<4"
dependencies = [
    "discord.py>=2,<3",
]

[dependency-groups]
dev = [
    "towncrier~=25.8.0",
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "examples" }
]
lint = [
    "ruff~=0.16.0",
    "ty==0.0.75",
]
docs = [
    "sphinx==8.1.3",
    "sphinx-autobuild==2024.10.03",
    "sphinx-copybutton~=0.5.2",
    "furo~=2025.12.19"
]
examples = [
    "quart==0.20.0",
    "fastapi~=0.141.1",
    "uvicorn~=0.52.0",
    "httptools~=0.8.0",
    "uvloop~=0.22.1 ; sys_platform != 'win32'"
]


[project.urls]
Homepage = "https://github.com/No767/discord-ext-ipcx"
Documentation = "https://discord-ext-ipcx.readthedocs.io/en/stable/"
Repository = "https://github.com/No767/discord-ext-ipcx"
Issues = "https://github.com/No767/discord-ext-ipcx/issues"

[tool.towncrier]
directory = "changes"
filename = "changelog.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## discord-ext-ipcx [{version}](https://github.com/No767/discord-ext-ipcx/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/No767/discord-ext-ipcx/issues/{issue})"
package = "ipcx"
package_dir = "discord/ext"

  [[tool.towncrier.section]]
    path = ""

  [[tool.towncrier.type]]
    directory = "bugfix"
    name = "Bug fixes"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "feature"
    name = "Features"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "deprecation"
    name = "Deprecations (removal in next major release)"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "breaking"
    name = "Removals and backward incompatible breaking changes"
    showcontent = true

  [[tool.towncrier.type]]
    directory = "doc"
    name = "Improved documentation"
    showcontent = true

  [[tool.towncrier.type]]
    # Changes that are hard to assign to any of the above categories.
    directory = "misc"
    name = "Miscellaneous internal changes"
    showcontent = true

[tool.ty.src]
include = ["discord/ext/ipcx/**", "examples/**"]
exclude = [
    "__pycache__", 
    "docs"
]

[[tool.ty.overrides]]
include = ["examples/**"]

[tool.ty.overrides.rules]
# ty flags discord.Intents as an invalid attribute but this has been known to be a ty-specific behavior
# using "discord.Intents" is correct
unresolved-attribute = "ignore"

[tool.ruff]
line-length = 88
include = ["discord/ext/ipcx/**", "examples/**"]

[tool.ruff.lint]
ignore = [
    "E501", 
    "N999", 
    "E402", 
    "S311",
    "S101",
    
    # These are recommended by Ruff if the formatter is to be used: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002"
]
select = ["E", "F", "N", "ASYNC", "S", "ERA", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "discord.ext.ipcx"
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
